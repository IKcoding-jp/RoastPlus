<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫・不足品 — RoastPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== DESIGN.md トークン (default theme) ===== */
  :root {
    --page: #F7F7F5;
    --surface: #FFFFFF;
    --ground: #F5F5F5;
    --field: #FFFFFF;

    --spot: #E48003;
    --spot-hover: #C56604;
    --spot-subtle: #f0f0f0;

    --btn-primary: #E48003;
    --btn-primary-hover: #C56604;

    --ink: #1f2937;
    --ink-sub: #4b5563;
    --ink-muted: #9ca3af;

    --edge: #e5e7eb;
    --edge-strong: #d1d5db;
    --edge-subtle: #f3f4f6;

    --danger: #dc2626;
    --success: #16a34a;
    --warning: #c79100;        /* 視認性のためテキスト用に少し濃く */
    --warning-dot: #eab308;

    --danger-subtle: #fee2e2;
    --success-subtle: #dcfce7;
    --warning-subtle: #fef9c3;

    --shadow-card: 0 1px 2px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.06);
    --radius-card: 16px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ===== FloatingNav ===== */
  .floating-nav {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 40;
  }
  .nav-back {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 9999px;
    background: var(--surface);
    border: 1px solid var(--edge);
    box-shadow: var(--shadow-card);
    color: var(--ink-sub);
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .nav-back:hover { color: var(--ink); border-color: var(--edge-strong); }

  /* ===== Container ===== */
  .container {
    max-width: 768px;            /* max-w-3xl 相当の引き締まった一覧幅 */
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  @media (min-width: 640px) {
    .container { padding: 64px 24px 80px; }
  }

  /* ===== Header ===== */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    margin-bottom: 6px;
  }
  .eyebrow svg { width: 15px; height: 15px; }

  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--ink);
  }
  @media (min-width: 640px) { h1 { font-size: 26px; } }
  .lede {
    margin-top: 4px;
    font-size: 13.5px;
    color: var(--ink-sub);
  }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    font-weight: 700;
    border: 1px solid transparent;
    border-radius: var(--radius-lg);
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s, color .18s, border-color .18s, box-shadow .18s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary {
    background: var(--btn-primary);
    color: #fff;
    font-size: 14px;
    padding: 9px 16px;
    box-shadow: 0 1px 2px rgba(196,102,4,.25);
  }
  .btn-primary:hover { background: var(--btn-primary-hover); }
  .btn-success-ghost {
    background: transparent;
    color: var(--success);
    border-color: var(--success);
    font-size: 13px;
    padding: 7px 12px;
  }
  .btn-success-ghost:hover { background: var(--success-subtle); }

  /* ===== Section ===== */
  section { margin-top: 28px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding-left: 2px;
  }
  .section-head h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .count-pill {
    display: inline-grid;
    place-items: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 9999px;
    background: var(--danger-subtle);
    color: var(--danger);
    font-size: 12px;
    font-weight: 700;
  }
  .count-pill.is-empty { background: var(--ground); color: var(--ink-muted); }

  /* ===== Card (surface) ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  /* ===== 要発注リスト rows ===== */
  .reorder-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .reorder-row + .reorder-row { border-top: 1px solid var(--edge-subtle); }
  .reorder-main { flex: 1; min-width: 0; }
  .reorder-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .reorder-name { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .reorder-meta { margin-top: 2px; font-size: 12px; color: var(--ink-muted); }

  .empty-reorder {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    color: var(--ink-sub);
    font-size: 13.5px;
  }
  .empty-reorder svg { width: 18px; height: 18px; color: var(--success); flex-shrink: 0; }

  /* ===== 品目 rows ===== */
  .item-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
  }
  .item-row + .item-row { border-top: 1px solid var(--edge-subtle); }

  .item-main { flex: 1; min-width: 0; }
  .item-title-line {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .item-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .item-updated {
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--ink-muted);
  }
  .item-updated b { font-weight: 500; color: var(--ink-sub); }

  /* Category badge */
  .badge {
    display: inline-flex;
    align-items: center;
    height: 19px;
    padding: 0 8px;
    border-radius: 9999px;
    background: var(--ground);
    color: var(--ink-sub);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .02em;
  }

  /* Status badge (要発注) */
  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 20px;
    padding: 0 8px;
    border-radius: 9999px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .status-tag .dot { width: 6px; height: 6px; border-radius: 9999px; }
  .status-tag.out { background: var(--danger-subtle); color: var(--danger); }
  .status-tag.out .dot { background: var(--danger); }

  /* ===== Segmented status control ===== */
  .seg {
    display: inline-flex;
    background: var(--ground);
    border: 1px solid var(--edge);
    border-radius: var(--radius-lg);
    padding: 2px;
    gap: 2px;
    flex-shrink: 0;
  }
  .seg-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 72px;
    height: 34px;
    padding: 0 12px;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    color: var(--ink-muted);
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg-btn .dot {
    width: 7px; height: 7px; border-radius: 9999px;
    background: currentColor; opacity: .55;
    transition: opacity .15s, background .15s;
  }
  .seg-btn:hover { color: var(--ink-sub); }

  /* active states pick semantic color */
  .seg-btn[data-level="ample"].is-active {
    background: var(--success); color: #fff;
    box-shadow: 0 1px 2px rgba(22,163,74,.3);
  }
  .seg-btn[data-level="low"].is-active {
    background: var(--warning-dot); color: #fff;
    box-shadow: 0 1px 2px rgba(202,145,0,.3);
  }
  .seg-btn[data-level="out"].is-active {
    background: var(--danger); color: #fff;
    box-shadow: 0 1px 2px rgba(220,38,38,.3);
  }
  .seg-btn.is-active .dot { opacity: 1; background: #fff; }

  /* ===== Row icon actions ===== */
  .row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: none; background: transparent;
    border-radius: 8px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn:hover { background: var(--ground); color: var(--ink-sub); }
  .icon-btn.danger:hover { background: var(--danger-subtle); color: var(--danger); }

  /* ===== Mobile: stack control under name ===== */
  @media (max-width: 560px) {
    .item-row { flex-wrap: wrap; }
    .item-main { flex: 1 1 60%; }
    .row-actions { order: 2; }
    .seg { order: 3; flex: 1 1 100%; margin-top: 6px; }
    .seg-btn { flex: 1; min-width: 0; }
    .reorder-row { flex-wrap: wrap; }
    .reorder-row .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
  <nav class="floating-nav">
    <button class="nav-back" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
  </nav>

  <div class="container">
    <header data-screen-label="在庫・不足品">
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/></svg>
        INVENTORY
      </div>
      <div class="header-row">
        <div>
          <h1>在庫・不足品</h1>
          <p class="lede">不足品をチームで共有し、発注漏れを防ぎます。</p>
        </div>
        <button class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          品目を追加
        </button>
      </div>
    </header>

    <section>
      <div class="section-head">
        <h2>要発注リスト</h2>
        <span class="count-pill" id="reorderCount">0</span>
      </div>
      <div class="card" id="reorderCard"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>すべての品目</h2>
      </div>
      <div class="card" id="itemsCard"></div>
    </section>
  </div>

<script>
  const STATUS = {
    ample: { label: "十分" },
    low:   { label: "少ない" },
    out:   { label: "切れた" },
  };

  const items = [
    { id: "i1", name: "三方袋",          cat: "消耗品", status: "ample", by: "kensaku.ikeda04", at: "6/1 07:17" },
    { id: "i2", name: "ドリップパック",  cat: "消耗品", status: "out",   by: "kensaku.ikeda04", at: "6/1 07:19" },
    { id: "i3", name: "ブレンド生豆",    cat: "原料",   status: "low",   by: "kensaku.ikeda04", at: "6/1 06:58" },
    { id: "i4", name: "テイクアウトカップ M", cat: "備品", status: "ample", by: "miyuki.sato", at: "5/31 18:40" },
    { id: "i5", name: "ペーパーフィルター", cat: "消耗品", status: "low", by: "miyuki.sato", at: "5/31 18:42" },
  ];

  const ICON = {
    edit:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    ok:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01-3-3"/></svg>',
  };

  function now() {
    const d = new Date();
    const M = d.getMonth() + 1, D = d.getDate();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${M}/${D} ${hh}:${mm}`;
  }

  const itemsCard = document.getElementById("itemsCard");
  const reorderCard = document.getElementById("reorderCard");
  const reorderCount = document.getElementById("reorderCount");

  function segMarkup(item) {
    return `<div class="seg" role="group" aria-label="在庫状態">` +
      Object.entries(STATUS).map(([lvl, s]) =>
        `<button class="seg-btn${item.status === lvl ? " is-active" : ""}" data-level="${lvl}" data-id="${item.id}">
           <span class="dot"></span>${s.label}
         </button>`
      ).join("") + `</div>`;
  }

  function renderItems() {
    itemsCard.innerHTML = items.map(item => `
      <div class="item-row">
        <div class="item-main">
          <div class="item-title-line">
            <span class="item-name">${item.name}</span>
            <span class="badge">${item.cat}</span>
          </div>
          <div class="item-updated">最終更新 <b>${item.by}</b> · ${item.at}</div>
        </div>
        ${segMarkup(item)}
        <div class="row-actions">
          <button class="icon-btn" aria-label="編集">${ICON.edit}</button>
          <button class="icon-btn danger" aria-label="削除">${ICON.trash}</button>
        </div>
      </div>
    `).join("");
  }

  function renderReorder() {
    const outItems = items.filter(i => i.status === "out");
    reorderCount.textContent = outItems.length;
    reorderCount.classList.toggle("is-empty", outItems.length === 0);

    if (outItems.length === 0) {
      reorderCard.innerHTML = `<div class="empty-reorder">${ICON.ok}<span>発注が必要な品目はありません。</span></div>`;
      return;
    }
    reorderCard.innerHTML = outItems.map(item => `
      <div class="reorder-row">
        <div class="reorder-main">
          <div class="reorder-title">
            <span class="reorder-name">${item.name}</span>
            <span class="status-tag out"><span class="dot"></span>切れた</span>
          </div>
          <div class="reorder-meta">${item.cat} · ${item.by}</div>
        </div>
        <button class="btn btn-success-ghost" data-resolve="${item.id}">
          ${ICON.check} 対応済みにする
        </button>
      </div>
    `).join("");
  }

  function render() { renderItems(); renderReorder(); }

  document.addEventListener("click", (e) => {
    const seg = e.target.closest(".seg-btn");
    if (seg) {
      const item = items.find(i => i.id === seg.dataset.id);
      if (item && item.status !== seg.dataset.level) {
        item.status = seg.dataset.level;
        item.at = now();
        render();
      }
      return;
    }
    const resolve = e.target.closest("[data-resolve]");
    if (resolve) {
      const item = items.find(i => i.id === resolve.dataset.resolve);
      if (item) { item.status = "ample"; item.at = now(); render(); }
    }
  });

  render();
</script>
</body>
</html>

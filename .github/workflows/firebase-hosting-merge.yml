name: Deploy to Firebase on merge

on:
  workflow_dispatch:
    inputs:
      deploy_hosting:
        description: "Deploy Firebase Hosting"
        required: true
        type: boolean
        default: true
      deploy_functions:
        description: "Deploy Cloud Functions"
        required: true
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "DESIGN.md"
      - ".github/**"

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  detect_changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      hosting_changed: ${{ steps.filter.outputs.hosting_changed }}
      functions_changed: ${{ steps.filter.outputs.functions_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect deploy targets
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hosting_changed=${{ inputs.deploy_hosting }}" >> "$GITHUB_OUTPUT"
            echo "functions_changed=${{ inputs.deploy_functions }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          target_sha="${{ github.event.pull_request.merge_commit_sha }}"

          if [ -z "$target_sha" ] || ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then
            target_sha="$(git rev-parse HEAD)"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$target_sha")"
          echo "$changed_files"

          if echo "$changed_files" | grep -Eq '^(app|components|hooks|lib|types|public|data|scripts)/|^(package-lock\.json|package\.json|next\.config\.ts|postcss\.config\.mjs|tsconfig\.json|firebase\.json)$'; then
            echo "hosting_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosting_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -Eq '^(functions/|firebase\.json$)'; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build_and_deploy:
    if: needs.detect_changes.outputs.hosting_changed == 'true'
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROASTPLUS_72FA6 }}
          channelId: live
          projectId: roastplus-72fa6

  health_check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - name: Wait for deployment propagation
        run: sleep 30
      - name: Check site availability
        run: |
          for i in 1 2 3; do
            if curl -sf https://roastplus-72fa6.web.app/ > /dev/null; then
              echo "Site is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Site health check failed after 3 attempts"
          exit 1

  deploy_functions:
    name: Deploy Cloud Functions
    if: needs.detect_changes.outputs.functions_changed == 'true'
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install and build Functions
        run: cd functions && npm ci && npm run build
      - name: Deploy Functions
        uses: w9jds/firebase-action@v15.10.0
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROASTPLUS_72FA6 }}
          PROJECT_ID: roastplus-72fa6
